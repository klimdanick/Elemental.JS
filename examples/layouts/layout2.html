<html>

<head>
    <script src="../../src/Elemental.js"></script>
    <script src="../../src/addons/codeBlock/codeblock.js"></script>
</head>
<script>

    let html = `<script src="../../src/Elemental.js"><\/script>`
    let js = `OnElementalLoad = () => {
    let g1, g2;
    let app =
    Layout.column({ id: "mainLayout" })
        .grid({classes:["g"]}, g => g1 = g).end()
        .row({classes:["g"]}, g => g2 = g).end()
    .root();

    let l1 = [], l2 = [];
    for (let i = 0; i < 4; i++) {
        l1.push(Layout.container());
    }
    for (let i = 0; i < 4; i++) {
        l2.push(Layout.container().grid({classes:["small_grid"]}).append(...l1));
    }
    g1.append(...l2)
    g2.append(...l2)
    body.append(app);
}`

    let css = `#nav {grid-area: box-1;}

#c1 {grid-area: box-2;}

#c2 {grid-area: box-3;}

#graph {grid-area: box-4;}

#menu {grid-area: box-5;}

#table {grid-area: box-6;}
    
#mainLayout {
    grid-template-columns: 1fr 2fr 3fr;
    grid-template-rows: 1fr 2fr 4fr;
    background-color: var(--level0);
    grid-template-areas: 
    "box-1 box-2 box-4"
    "box-5 box-3 box-4"
    "box-6 box-6 box-6"
}
    
#mainLayout .container {
    height: 100%;
    width: 100%;
}`

    let app, visual, codePreview;
    let nav, c1, c2, graph, menu, table;
    OnElementalLoad = () => {
        app =
            Layout.row({ id: "mainLayout" })
                .grid({ id: "visual"}, c => visual = c)
                    .container({id:"nav", classes:["level0"]}, n => nav = n).end()
                    .container({id:"c1", classes:["level2"]}, n => c1 = n).end()
                    .container({id:"c2", classes:["level2"]}, n => c2 = n).end()
                    .container({id:"graph", classes:["level1"]}, n => graph = n).end()
                    .container({id:"menu", classes:["level0"]}, n => menu = n).end()
                    .container({id:"table", classes:["level-1"]}, n => table = n).end()
                .end()
                .container({ id: "codePreview"}, c => codePreview = c)
                    .append(
                        new CodeBlock({code: html, language:"html"}),
                        new CodeBlock({code: js, language:"js"}),
                        new CodeBlock({code: css, language:"css"})
                    )
            .root();


        body.append(app);
    }
</script>
<style>

    #nav {grid-area: box-1;}

    #c1 {grid-area: box-2;}

    #c2 {grid-area: box-3;}

    #graph {grid-area: box-4;}

    #menu {grid-area: box-5;}

    #table {grid-area: box-6;}
    
    #visual {
        grid-template-columns: 1fr 2fr 3fr;
        grid-template-rows: 1fr 2fr 4fr;
        background-color: var(--level0);
        grid-template-areas: 
        "box-1 box-2 box-4"
        "box-5 box-3 box-4"
        "box-6 box-6 box-6"
    }

    #visual .container {
        height: 100%;
        width: 100%;
    }
    
    #mainLayout {
        background-color: var(--BLACK_PEARL);
    }

    #codePreview, #visual {
        width: 100%;
        height: 100%;
    }

    #codePreview {
        background: none;
        overflow: auto;
    }

    #codePreview pre {
        width: 90%;
        margin: 0;
    }
</style>

<body></body>

</html>
