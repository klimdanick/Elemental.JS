<html>

<head>
    <script src="../../src/Elemental.js"></script>
</head>
<script>

    loadAddon("../../src/addons/codeblock.js");

    let html = `<script src="../../src/Elemental.js"><\/script>`
    let js = `OnElementalLoad = () => {
    let g1, g2;
    let app =
    Layout.column({ id: "mainLayout" })
        .grid({classes:["g"]}, g => g1 = g).end()
        .row({classes:["g"]}, g => g2 = g).end()
    .root();

    let l1 = [], l2 = [];
    for (let i = 0; i < 4; i++) {
        l1.push(Layout.container());
    }
    for (let i = 0; i < 4; i++) {
        l2.push(Layout.container().grid({classes:["small_grid"]}).append(...l1));
    }
    g1.append(...l2)
    g2.append(...l2)
    body.append(app);
}`

    let css = `.container {
    background-color: var(--CINDER_BLACK);
}

.grid {
    grid-template-columns: auto auto;
}

.g {
    background-color: var(--BLACK_PEARL);
}

.small_grid .container {
    background-color: var(--CURIOS_BLUE);
}`

    let g1, g2;
    let app, visual, codePreview;
    OnElementalLoad = () => {
        app =
            Layout.row({ id: "mainLayout" })
                .column({ id: "visual"}, c => visual = c)
                    .grid({classes:["g"]}, g => g1 = g).end()
                    .row({classes:["g"]}, g => g2 = g).end()
                .end()
                .container({ id: "codePreview"}, c => codePreview = c)
                    .append(
                        new CodeBlock({code: html, language:"html"}),
                        new CodeBlock({code: js, language:"js"}),
                        new CodeBlock({code: css, language:"css"})
                    )
            .root();

        let l1 = [], l2 = [];
        for (let i = 0; i < 4; i++) {
            l1.push(Layout.container());
        }
        for (let i = 0; i < 4; i++) {
            l2.push(Layout.container().grid({classes:["small_grid"]}).append(...l1));
        }
        
        g1.append(...l2)
        g2.append(...l2)


        body.append(app);

        body.render();
    }
</script>
<style>

    #mainLayout {
        background-color: var(--BLACK_PEARL);
    }

    .container {
        background-color: var(--CINDER_BLACK);
    }

    .grid {
        grid-template-columns: auto auto;
    }

    .g {
        background-color: var(--BLACK_PEARL);
    }

    .small_grid .container {
        background-color: var(--CURIOS_BLUE);
    }

    #codePreview, #visual {
        width: 100%;
        height: 100%;
    }

    #codePreview {
        background: none;
        overflow: auto;
    }

    #codePreview pre {
        width: 90%;
        margin: 0;
    }
</style>

<body></body>

</html>
